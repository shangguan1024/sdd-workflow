name: sdd-workflow
description: "Use when developing a software feature, fixing a bug, or refactoring code with the local sdd-workflow-plugin, SDD phase gates, CLI/tool workflow control, structured research, design, planning, verification, review, and memory handoff."
version: "2.4.0"
author: "opencode team"
categories:
  - workflow
  - plugin
  - software-development
  - architecture-aware
plugin:
  local_path: "E:/workspace/coding/tools/sdd-workflow-plugin"
  entry: "E:/workspace/coding/tools/sdd-workflow-plugin/dist/index.js"
  cli: "E:/workspace/coding/tools/sdd-workflow-plugin/bin/sdd.js"
dependencies:
  - sdd-workflow-plugin@^1.0.0
  - comprehensive-research-agent@^1.0.0
  - systematic-debugging@^1.0.0
  - brainstorming@^1.0.0
  - writing-plans@^1.0.0
  - test-driven-development@^1.0.0
  - subagent-driven-development@^1.0.0
  - verification-before-completion@^1.0.0
  - requesting-code-review@^1.0.0
  - code-review-quality@^1.0.0
  - memory-systems@^1.0.0
